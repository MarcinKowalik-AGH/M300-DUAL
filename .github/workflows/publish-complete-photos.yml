name: Publish complete M300 Dual PCB photo archive

on:
  push:
    branches: [main]
    paths:
      - "hardware/photos/incoming/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow==11.3.0"
      - name: Convert and validate exactly 48 PNG images with no metadata
        run: python hardware/photos/build_archive.py
      - name: Publish downloadable archive and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware/photos/M300_Dual_Photos_48_PNG.zip hardware/photos/contact_sheet_48.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: publish verified 48-photo PNG M300 Dual archive'
          git push
